name: Fil
options:
  bundleIdPrefix: sh.fil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3SNT64YKAS
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 23
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.13.0"
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture.git
    from: "1.25.0"

targets:
  Fil:
    type: application
    platform: iOS
    sources:
      - Fil
      - Shared
    resources:
      - Fil/Assets.xcassets
      - Fil/Resources
    dependencies:
      - package: SwiftTerm
      - package: ComposableArchitecture
      - target: FilWidgets
    info:
      path: Fil/Info.plist
      properties:
        CFBundleDisplayName: Fil.sh
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fil
            CFBundleURLName: sh.fil.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.fil.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Fil/Fil.entitlements

  FilWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FilWidgets
      - Shared
    resources:
      - FilWidgets/Localizable.xcstrings
    info:
      path: FilWidgets/Info.plist
      properties:
        CFBundleDisplayName: FilWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.fil.app.widgets
        CODE_SIGN_ENTITLEMENTS: FilWidgets/FilWidgets.entitlements

  FilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FilTests
    dependencies:
      - target: Fil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.fil.app.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Fil:
    build:
      targets:
        Fil: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FilTests
